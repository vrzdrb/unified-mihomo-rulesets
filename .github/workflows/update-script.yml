              "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-ads.yaml"
          )
          echo "Загрузка ${#urls[@]} источников..."
          for u in "${urls[@]}"; do
              echo -n "$(basename "$u")..."

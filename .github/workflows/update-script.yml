          sed 's/[[:space:]]*![a-z]*[[:space:]]*$//' | \
          sed 's/[[:space:]]\+$//' | \
          sed 's/\.$//' | \
          grep '\.' | \
          sed 's/\.\././g' | \
          sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
          tr '[:upper:]' '[:lower:]' | \
          grep -v 'regexp' | \
          grep -v '[^a-z0-9\.\-]' | \
          awk -F. 'NF<=7' | \
          sort -u > "$U"
          
          echo " найдено $(wc -l < "$U") доменов" && echo "payload:" > "$O" && \
          sed "s/^/  - '+./;s/$/'/" "$U" >> "$O"
          
          echo "Первый домен: $(head -2 "$O" | tail -1)"
          rm -f "$T" "$U" && echo "Сохранено в $O"
          

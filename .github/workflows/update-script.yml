            "https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Subnets/IPv4/discord.lst"
            "https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Subnets/IPv4/meta.lst"
            "https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Subnets/IPv4/telegram.lst"
            "https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Subnets/IPv4/twitter.lst"
            "https://raw.githubusercontent.com/GhostRooter0953/discord-voice-ips/refs/heads/master/main_domains/discord-main-ip-list"
            "https://raw.githubusercontent.com/GhostRooter0953/discord-voice-ips/refs/heads/master/voice_domains/discord-voice-ip-list"
            "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt"
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/cz.list"
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/ua.yaml"
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/netflix.yaml"
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/telegram.yaml"
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/twitter.yaml"
            "https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/refs/heads/main/ru-bundle/rknasnblock.list"
          )
          echo "Загрузка ${#urls[@]} источников..."
          for u in "${urls[@]}"; do
            echo -n "$(basename "$u")..." && \
            curl -sSL --connect-timeout 10 --max-time 30 "$u" >> "$T" 2>/dev/null && \
            echo " ✓" || echo " ✗"
          done
          echo -n "Обработка..." && \
          grep -v '^[[:space:]]*[#!]' "$T" | \
          grep -v '^[[:space:]]*$' | \
          grep -v '^[[:space:]]*include:' | \
          grep -v '^[[:space:]]*full:' | \
          grep -v '^[[:space:]]*[a-zA-Z_-]*:' | \
          sed 's/^[[:space:]]*IP-CIDR,[[:space:]]*//i;s/^[[:space:]]*-[[:space:]]*//;s/["'\'']//g' | \
          sed 's/[[:space:]]\+/\n/g' | \
          sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
          grep -E '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' | \
          sed 's/[^0-9\.\/].*$//' | \
          awk '{
            gsub(/[^0-9\.\/]/, "", $0)
            if ($0 ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/) {
              split($0, parts, "/")
              if (parts[2] >= 0 && parts[2] <= 32) {
                print $0
              }
            } else if ($0 ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) {
              print $0 "/32"
            }
          }' | sort -u | \
          awk -F'/' '{
            n = split($1, o, ".")
            ipint = 0
            for (i = 1; i <= n; i++) ipint = ipint * 256 + o[i]
            prefix = $2 + 0
            blocksize = 2 ^ (32 - prefix)
            network = int(ipint / blocksize) * blocksize
            end = network + blocksize - 1
            printf "%.0f\t%d\t%.0f\t%s\n", network, prefix, end, $0
          }' | sort -k1,1n -k2,2n | \
          awk -F'\t' '
          BEGIN { maxend = -1 }
          {
            network = $1 + 0
            end = $3 + 0
            if (network <= maxend) next
            print $4
            maxend = end
          }' | sort -u | \
          sed "s/^/ - '/;s/$/'/" > "$T.2"
          echo " найдено $(wc -l < "$T.2") CIDR (подсети, полностью покрытые другой уже включённой подсетью, удалены)" && \
          echo "payload:" > "$O" && cat "$T.2" >> "$O"
          echo "Первая подсеть: $(head -2 "$O" | tail -1)"
          rm -f "$T.2"
          rm -f "$T" && echo "Сохранено в $O"


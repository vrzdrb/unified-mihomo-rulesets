name: Update

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Changes
        run: git pull

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y curl wget git jq

      - name: Download and install Mihomo
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -L https://github.com/MetaCubeX/mihomo/releases/download/v1.19.22/mihomo-linux-amd64-v1.19.22.deb -o mihomo-linux-amd64-v1.19.22.deb
          sudo apt install --fix-missing ./mihomo-linux-amd64-v1.19.22.deb

      - name: Update adblock list
        run: |
          #!/bin/bash
          T=$(mktemp) && U=$(mktemp) && O="uni-adblock.yaml"
          > "$O"
          urls=(
            "https://raw.githubusercontent.com/sjhgvr/oisd/refs/heads/main/domainswild2_small.txt"
            "https://raw.githubusercontent.com/sjhgvr/oisd/refs/heads/main/domainswild_small.txt"
          )
          echo "Загрузка ${#urls[@]} источников..."
          for u in "${urls[@]}"; do
            echo -n "$(basename "$u")..."
            curl -sSL --connect-timeout 10 --max-time 30 "$u" >> "$T" 2>/dev/null && echo " ✓" || echo " ✗"
          done
          echo -n "Обработка..." && \
          sed -i 's/^[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+[[:space:]]\+//;s/^[[:space:]]*127\.0\.0\.1[[:space:]]\+//;s/^[[:space:]]*0\.0\.0\.0[[:space:]]\+//' "$T" && \
          grep -v '#' "$T" | \
          grep -v '^[[:space:]]*!' | \
          grep -v '^[[:space:]]*$' | \
          grep -v '^[[:space:]]*include:' | \
          sed 's/^[[:space:]]*full://i' | \
          sed 's/^[[:space:]]*domain://i' | \
          sed 's/^[[:space:]]*DOMAIN-SUFFIX,//i;s/^[[:space:]]*DOMAIN,//i;s/^[[:space:]]*-[[:space:]]*//;s/["'\'']//g' | \
          sed 's/@ads.*$//' | \
          sed 's/@.*$//' | \
          sed 's/[[:space:]]*[!]cn[[:space:]]*$//' | \
          sed 's/[[:space:]]*cn[[:space:]]*$//' | \
          sed 's/[[:space:]]*![a-z]*[[:space:]]*$//' | \
          sed 's/[[:space:]]\+$//' | \
          sed 's/\.$//' | \
          grep '\.' | \
          sed 's/\.\././g' | \
          sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
          tr '[:upper:]' '[:lower:]' | \
          grep -v 'regexp' | \
          grep -v '[^a-z0-9\.\-]' | \
          awk -F. 'NF<=7' | \
          sort -u > "$U" && \
          awk '{
            n = split($0, a, ".")
            rev = a[n]
            for (i = n - 1; i >= 1; i--) rev = rev "." a[i]
            print rev "\t" $0
          }' "$U" | sort | awk -F'\t' '
          {
            key = $1; dom = $2
            if (prev != "" && (key == prev || index(key, prev ".") == 1)) next
            print dom
            prev = key
          }' | sort > "$U.dedup" && mv "$U.dedup" "$U"
          echo " найдено $(wc -l < "$U") доменов (поддомены, покрытые родительскими +.доменами, удалены)" && echo "payload:" > "$O" && \
          sed "s/^/ - '+./;s/$/'/" "$U" >> "$O"
          echo "Первый домен: $(head -2 "$O" | tail -1)"
          rm -f "$T" "$U" && echo "Сохранено в $O"


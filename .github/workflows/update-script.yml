          sed 's/[[:space:]]*[!]cn[[:space:]]*$//' | \
          sed 's/[[:space:]]*cn[[:space:]]*$//' | \
          sed 's/[[:space:]]*![a-z]*[[:space:]]*$//' | \
          sed 's/[[:space:]]\+$//' | \
          sed 's/\.$//' | \
          grep '\.' | \
          sed 's/\.\././g' | \
          sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
          tr '[:upper:]' '[:lower:]' | \
          grep -v 'regexp' | \
          grep -v '[^a-z0-9\.\-]' | \
          awk -F. 'NF<=7' | \
          sort -u > "$U" && \
          awk '{
            n = split($0, a, ".")
            rev = a[n]
            for (i = n - 1; i >= 1; i--) rev = rev "." a[i]
            print rev "\t" $0
          }' "$U" | sort | awk -F'\t' '
          {
            key = $1; dom = $2
            if (prev != "" && (key == prev || index(key, prev ".") == 1)) next
            print dom
            prev = key
          }' | sort > "$U.dedup" && mv "$U.dedup" "$U"
          echo " найдено $(wc -l < "$U") доменов (поддомены, покрытые родительскими +.доменами, удалены)" && echo "payload:" > "$O" && \
          sed "s/^/ - '+./;s/$/'/" "$U" >> "$O"
          echo "Первый домен: $(head -2 "$O" | tail -1)"
          rm -f "$T" "$U" && echo "Сохранено в $O"

